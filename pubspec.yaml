name: labaku
description: "Aplikasi kalkulator HPP dan kasir untuk UMKM."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  image_picker: ^1.2.4
  file_picker: ^13.4.0
  fl_chart: ^1.3.1
  flutter_dotenv: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env