name: labaku
description: Labaku - aplikasi hitung HPP & laba untuk usaha.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  web: ^1.1.0
  pdf: ^3.11.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/icon_app.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/images/icon_app.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "lib/assets/images/icon_app.png"
    background_color: "#FFFFFF"
    theme_color: "#2255A4"
  windows:
    generate: true
    image_path: "lib/assets/images/icon_app.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - .env
    - lib/assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: lib/assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
